function StudyCircleChart({percent,done,total}){
const radius=75;const circ=2*Math.PI*radius;const offset=circ-(percent/100)*circ;
return(
<div className="flex flex-col items-center py-2">
<svg width="210" height="210" viewBox="0 0 210 210" style={{filter:'drop-shadow(0 0 20px rgba(255,215,0,0.4))'}}>
<defs><linearGradient id="gradCircle" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#ffd700"/><stop offset="50%" stopColor="#a855f7"/><stop offset="100%" stopColor="#ec4899"/></linearGradient></defs>
<circle cx="105" cy="105" r={radius} fill="none" stroke="rgba(168,85,247,0.15)" strokeWidth="18"/>
<circle cx="105" cy="105" r={radius} fill="none" stroke="url(#gradCircle)" strokeWidth="18" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" transform="rotate(-90 105 105)" style={{transition:'stroke-dashoffset 1s ease',filter:'drop-shadow(0 0 10px rgba(255,215,0,0.6))'}}/>
<text x="105" y="103" textAnchor="middle" fontSize="40" fontWeight="900" fill="url(#gradCircle)">{percent}%</text>
<text x="105" y="128" textAnchor="middle" fontSize="13" fontWeight="700" fill="#94a3b8">{done}/{total} Notes</text>
</svg>
<p className="text-center text-sm font-bold mt-2" style={{color:'#ffd700'}}>{percent>=75?'🎉 Excellent!':percent>=50?'💪 Good Progress':percent>0?'📚 Keep Going':'🚀 Start Reading!'}</p>
</div>
);
}

function QuizResultsChart({history}){

return(
<div className="space-y-4 max-h-80 overflow-y-auto pr-2">
{history.slice(0,10).map((h,i)=>{
const pct=Math.round((h.score/h.total)*100);
const barColor=pct>=80?'linear-gradient(90deg,#10b981,#06b6d4)':pct>=50?'linear-gradient(90deg,#f59e0b,#f97316)':'linear-gradient(90deg,#ef4444,#ec4899)';
return(
<div key={i} className="pb-2">
<div className="flex justify-between text-xs font-bold mb-2"><span className="truncate pr-2 text-white/90">{h.title}</span><span style={{color:pct>=80?'#10b981':pct>=50?'#f59e0b':'#ef4444'}}>{h.score}/{h.total} ({pct}%)</span></div>
<div className="w-full h-3 bg-black/30 rounded-full overflow-hidden border border-white/10"><div style={{width:`${pct}%`,background:barColor,transition:'width 0.6s ease',height:'100%',borderRadius:'999px',boxShadow:'0 0 12px rgba(255,215,0,0.3)'}}/></div>
<p className="text-[10px] opacity-50 mt-1 text-white">{h.date}</p>
</div>
);
})}
</div>
);
}

<h4 className="font-black text-emerald-400 text-sm">➕ New Quiz</h4>
<div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
<input type="text" placeholder="Quiz Title *" value={newQuiz.title} onChange={e=>setNewQuiz({...newQuiz,title:e.target.value})} className={miniCls}/>
<select value={newQuiz.classLevel} onChange={e=>setNewQuiz({...newQuiz,classLevel:e.target.value})} className={miniCls}>{classesList.map(c=><option key={c} value={c} className="bg-slate-800">Class {c}</option>)}</select>
<select value={newQuiz.subject} onChange={e=>setNewQuiz({...newQuiz,subject:e.target.value})} className={miniCls}>{subjectsList.map(s=><option key={s} value={s} className="bg-slate-800">{s}</option>)}</select>
<select value={newQuiz.medium} onChange={e=>setNewQuiz({...newQuiz,medium:e.target.value})} className={miniCls}><option value="en" className="bg-slate-800">English</option><option value="hi" className="bg-slate-800">हिन्दी</option></select>
</div>
<div className="border-t border-white/10 pt-4">
<div className="flex justify-between items-center mb-3"><h5 className="font-black text-white text-sm">❓ Questions ({newQuiz.questions.length})</h5><button onClick={addQuestion} className="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-black">➕ Add Question</button></div>
<div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
{newQuiz.questions.map((q,idx)=>(
<div key={idx} className="p-4 rounded-xl bg-white/5 border border-white/10">
<div className="flex justify-between items-center mb-3"><span className="text-xs font-black text-emerald-400">Q{idx+1}</span>{newQuiz.questions.length>1&&<button onClick={()=>removeQuestion(idx)} className="text-xs text-rose-400 font-black">🗑️</button>}</div>
<input type="text" placeholder="Question text *" value={q.q} onChange={e=>updateQuestion(idx,'q',e.target.value)} className={miniCls+' mb-2'}/>
<p className="text-xs font-bold text-white/60 mb-2">Options (सही चुनें):</p>
<div className="space-y-2">
{q.options.map((opt,oi)=>(
<label key={oi} className="flex items-center gap-2 cursor-pointer">
<input type="radio" name={`correct_${idx}`} checked={q.correct===oi} onChange={()=>updateQuestion(idx,'correct',oi)} className="w-4 h-4 accent-yellow-400 flex-shrink-0"/>
<span className="text-xs font-black text-white/60 w-4">{String.fromCharCode(65+oi)}.</span>
<input type="text" placeholder={`Option ${String.fromCharCode(65+oi)}`} value={opt} onChange={e=>updateOption(idx,oi,e.target.value)} className={miniCls}/>
</label>
))}
</div>
</div>
))}
</div>
</div>
<button onClick={saveNewQuiz} className="btn-purple w-full py-3 rounded-xl text-base">✅ Save Quiz</button>
</div>
)}
<div className="space-y-2 max-h-96 overflow-y-auto pr-2">
{quizzes.map(q=>(
<div key={q.id} className="flex items-center justify-between gap-3 p-3 rounded-xl bg-white/5 border border-white/10 hover:border-emerald-500/40">
<div className="flex-1 min-w-0"><p className="text-sm font-bold text-white truncate">{q.title}</p><p className="text-xs text-white/50">Class {q.classLevel} • {q.subject} • {q.questions.length}q</p></div>
<button onClick={()=>deleteQuiz(q.id,q.title)} className="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-xs font-black flex-shrink-0">🗑️</button>
</div>
))}
</div>
</section>
</div>
)}

{adminTab==='railtest'&&(
<section className="glass rounded-2xl p-6 border border-orange-500/30">
<h3 className="text-xl font-black mb-5 bg-gradient-to-r from-orange-400 to-red-400 bg-clip-text text-transparent">🚂 Manage Railtest Q&A ({railtest.length})</h3>
<div className="p-4 rounded-2xl bg-black/30 border border-orange-500/30 mb-5 space-y-3">
<h4 className="font-black text-orange-400 text-sm">➕ New Q&A</h4>
<textarea placeholder="Question *" value={newRailtest.question} onChange={e=>setNewRailtest({...newRailtest,question:e.target.value})} rows={2} className={miniCls}></textarea>
<textarea placeholder="Answer *" value={newRailtest.answer} onChange={e=>setNewRailtest({...newRailtest,answer:e.target.value})} rows={3} className={miniCls}></textarea>
<input type="text" placeholder="Category (e.g., General, Science, History)" value={newRailtest.category} onChange={e=>setNewRailtest({...newRailtest,category:e.target.value})} className={miniCls}/>
<button onClick={saveRailtest} className="btn-orange w-full py-2.5 rounded-xl text-sm">✅ Add Q&A</button>
</div>
<div className="space-y-2 max-h-96 overflow-y-auto pr-2">
{railtest.map(r=>(
<div key={r.id} className="flex items-start justify-between gap-3 p-3 rounded-xl bg-white/5 border border-white/10 hover:border-orange-500/40">
<div className="flex-1 min-w-0">
<p className="text-sm font-bold text-white">Q: {r.question}</p>
<p className="text-xs text-emerald-400 mt-1">A: {r.answer}</p>
<p className="text-xs text-orange-400 mt-1">📁 {r.category}</p>
</div>
<button onClick={()=>deleteRailtest(r.id)} className="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-xs font-black flex-shrink-0">🗑️</button>
</div>
))}
{railtest.length===0&&<p className="text-center text-white/50 py-4">Koi Q&A nahi.</p>}
</div>
</section>
)}

{adminTab==='payments'&&(
<section className="glass rounded-2xl p-6">
<div className="flex justify-between items-center mb-5 flex-wrap gap-3">
<h3 className="text-xl font-black text-yellow-400">📸 Payments ({payments.length})</h3>
<button onClick={deleteOldPayments} className="px-4 py-2 bg-rose-600 text-white rounded-lg text-xs font-black hover:bg-rose-700 shadow-lg">🗑️ Clear Approved/Rejected</button>
</div>
<p className="text-xs text-white/60 mb-4">💡 Approve/Reject ke baad 🗑️ se delete kar dein — screenshot storage bachegi</p>
<div className="overflow-x-auto">
<table className="w-full text-left text-sm">
<thead><tr className="border-b border-yellow-500/30">
<th className="p-2 text-yellow-400 text-xs uppercase">Student</th>
<th className="p-2 text-yellow-400 text-xs uppercase">UTR</th>
<th className="p-2 text-yellow-400 text-xs uppercase">Proof</th>
<th className="p-2 text-yellow-400 text-xs uppercase">Status</th>
<th className="p-2 text-yellow-400 text-xs uppercase">Action</th>
</tr></thead>
<tbody>
{payments.map(p=>(
<tr key={p.id} className="border-b border-white/5">
<td className="p-2 font-bold text-white">{p.studentName}</td>
<td className="p-2 font-mono font-bold text-yellow-400">{p.utr}</td>
<td className="p-2"><img src={p.screenshot} onClick={()=>setZoomImage(p.screenshot)} className="h-14 w-14 object-cover rounded-lg border-2 border-yellow-400/50 cursor-pointer" alt="proof"/></td>
<td className="p-2"><span className={`px-2 py-0.5 rounded-full text-xs font-black uppercase ${p.status==='approved'?'bg-emerald-500/20 text-emerald-400':p.status==='rejected'?'bg-rose-500/20 text-rose-400':'bg-amber-500/20 text-amber-400'}`}>{p.status}</span></td>
<td className="p-2">
<div className="flex gap-2 flex-wrap">
{p.status==='pending'&&(
<>
<button onClick={()=>verifyPayment(p.id,'approved')} className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-black" title="Approve">✅</button>
<button onClick={()=>verifyPayment(p.id,'rejected')} className="px-3 py-1 bg-rose-600 text-white rounded-lg text-xs font-black" title="Reject">❌</button>
</>
)}
<button onClick={()=>deletePayment(p.id)} className="px-3 py-1 bg-red-700 text-white rounded-lg text-xs font-black" title="Delete this payment entry">🗑️</button>
</div>
</td>
</tr>
))}
{payments.length===0&&(
<tr><td colSpan="5" className="p-6 text-center text-white/50">Koi payment nahi.</td></tr>
)}
</tbody>
</table>
</div>
</section>
)}

{adminTab==='password'&&(
<section className="glass rounded-2xl p-6">
<h3 className="text-xl font-black mb-4 text-pink-400">🔐 Change Password</h3>
<form onSubmit={handlePasswordChange} className="space-y-4 text-sm">
<input type="password" required value={passForm.oldPass} onChange={e=>setPassForm({...passForm,oldPass:e.target.value})} placeholder="Current Password" className={inputCls}/>
<input type="password" required value={passForm.newPass} onChange={e=>setPassForm({...passForm,newPass:e.target.value})} placeholder="New Password (min 6)" className={inputCls}/>
<button className="w-full py-2.5 rounded-xl bg-pink-600 text-white font-black">Update Password</button>
</form>
</section>
)}

{adminTab==='reset'&&(
<section className="glass rounded-2xl p-6 border border-rose-500/30">
<h3 className="text-xl font-black mb-4 text-rose-400">🗑️ Reset All Data</h3>
<p className="text-sm text-white/70 mb-4">Sab kuch reset ho jayega — notes, quizzes, announcements, railtest, settings, payments. Sample data wapas aa jayega. <strong className="text-rose-400">Warning: Apna data delete ho jayega!</strong></p>
<button onClick={resetAllData} className="btn-rose w-full py-3 rounded-xl">⚠️ Reset Everything</button>
</section>
)}

</div>
)}

</main>

{openNote&&(
<div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-2 sm:p-4 backdrop-blur-md">
<div className="w-full max-w-3xl max-h-[92vh] overflow-hidden rounded-3xl shadow-2xl flex flex-col" style={{background:'linear-gradient(135deg,rgba(20,10,40,0.98),rgba(10,5,25,0.98))',border:'2px solid rgba(255,215,0,0.3)'}}>
<div className="bg-gradient-to-r from-yellow-500 via-pink-500 to-purple-600 text-white p-4 flex justify-between items-center"><div><h3 className="font-black text-base">{openNote.title}</h3><p className="text-xs opacity-90">Class {openNote.classLevel} • {openNote.subject} • {openNote.medium==='en'?'English':'हिन्दी'}</p></div><button onClick={()=>setOpenNote(null)} className="p-2 rounded-lg bg-black/30 hover:bg-black/50 text-lg">✕</button></div>
<div className="p-5 overflow-y-auto page-body flex-1 text-sm"><h3 className="text-lg font-black mb-3 bg-gradient-to-r from-yellow-400 to-pink-400 bg-clip-text text-transparent">{openNote.pages[openPage].heading}</h3><div dangerouslySetInnerHTML={{__html:openNote.pages[openPage].body}}/></div>
<div className="p-4 border-t border-yellow-500/20 space-y-2">
<button onClick={()=>toggleRead(openNote.id)} className={`w-full py-2.5 rounded-xl font-black text-sm ${readNotes.includes(openNote.id)?'bg-emerald-500 text-white':'bg-white/10 text-white/70 border-2 border-white/20 hover:border-yellow-400'}`}>{readNotes.includes(openNote.id)?'✅ Marked as Read':'⬜ Mark as Read'}</button>
<div className="flex justify-between items-center gap-2">
<button onClick={()=>setOpenPage(Math.max(0,openPage-1))} disabled={openPage===0} className="px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white font-bold text-sm disabled:opacity-30">← Prev</button>
<span className="text-sm font-bold text-yellow-400">Page {openPage+1} / {openNote.pages.length}</span>
<button onClick={()=>setOpenPage(Math.min(openNote.pages.length-1,openPage+1))} disabled={openPage===openNote.pages.length-1} className="btn-gold px-4 py-2 rounded-xl text-sm disabled:opacity-30">Next →</button>
</div>
</div>
</div>
</div>
)}

{activeQuiz&&(
<div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-2 sm:p-4 backdrop-blur-md">
<div className="w-full max-w-2xl max-h-[92vh] overflow-y-auto rounded-3xl shadow-2xl" style={{background:'linear-gradient(135deg,rgba(20,10,40,0.98),rgba(10,5,25,0.98))',border:'2px solid rgba(16,185,129,0.4)'}}>
<div className="sticky top-0 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 text-white p-4 flex justify-between items-center rounded-t-3xl z-10"><div><h3 className="font-black text-base">{activeQuiz.title}</h3><p className="text-xs opacity-90">{activeQuiz.questions.length} Questions</p></div><button onClick={closeQuiz} className="p-2 rounded-lg bg-black/30 hover:bg-black/50 text-lg">✕</button></div>
<div className="p-5 space-y-4">
{activeQuiz.questions.map((q,i)=>{
const chosen=quizAnswers[i];const correct=q.correct;
return(
<div key={i} className={`p-4 rounded-2xl border-2 transition-all ${quizSubmitted?(chosen===correct?'border-emerald-500 bg-emerald-500/10':'border-rose-500 bg-rose-500/10'):'border-white/15 bg-white/5'}`}>
<p className="font-bold mb-3 text-white">Q{i+1}. {q.q}</p>
<div className="space-y-2">
{q.options.map((opt,idx)=>(
<label key={idx} className={`flex items-center gap-2 p-2.5 rounded-xl cursor-pointer text-sm transition-all ${quizSubmitted&&idx===correct?'bg-emerald-500/20 font-bold border border-emerald-500':'hover:bg-white/10 text-white/80 border border-transparent'}`}>
<input type="radio" name={`q${i}`} disabled={quizSubmitted} checked={chosen===idx} onChange={()=>setQuizAnswers({...quizAnswers,[i]:idx})} className="accent-yellow-400"/>
<span>{String.fromCharCode(65+idx)}. {opt}</span>
{quizSubmitted&&idx===correct&&<span className="ml-auto text-emerald-400 font-black">✓</span>}
{quizSubmitted&&chosen===idx&&idx!==correct&&<span className="ml-auto text-rose-400 font-black">✗</span>}
</label>
))}
</div>
</div>
);
})}
</div>
<div className="p-5 border-t border-emerald-500/20">
{!quizSubmitted?(
<button onClick={submitQuiz} disabled={Object.keys(quizAnswers).length<activeQuiz.questions.length} className={`w-full py-3 rounded-xl font-black text-white ${Object.keys(quizAnswers).length<activeQuiz.questions.length?'bg-white/10 text-white/40 cursor-not-allowed':'btn-emerald'}`}>✅ Submit Quiz</button>
):(
<div className="text-center">
<p className="text-3xl font-black mb-3 text-white">🎉 Score: <span className="text-yellow-400">{quizScore}</span> / {activeQuiz.questions.length}</p>
<p className="text-sm mb-4 text-yellow-300">{Math.round(quizScore/activeQuiz.questions.length*100)>=80?'🌟 Excellent!':Math.round(quizScore/activeQuiz.questions.length*100)>=50?'💪 Good Job!':'📚 Keep Practicing!'}</p>
<button onClick={closeQuiz} className="btn-purple w-full py-3 rounded-xl">Close</button>
</div>
)}
</div>
</div>
</div>
)}

{zoomImage&&(
<div onClick={()=>setZoomImage(null)} className="fixed inset-0 bg-black/90 flex items-center justify-center z-[60] p-4 cursor-zoom-out backdrop-blur-md">
<img src={zoomImage} className="max-h-[85vh] rounded-2xl border-4 border-yellow-400 shadow-2xl" alt="zoom"/>
</div>
)}

<a href={`https://wa.me/${settings.whatsappNumber}?text=${encodeURIComponent('Hello, mujhe EduNotes Premium ke baare mein help chahiye.')}`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-40 flex items-center gap-2 text-white font-black px-5 py-3.5 rounded-full shadow-2xl hover:scale-110 transition-transform" style={{background:'linear-gradient(135deg,#25d366,#128c7e)',boxShadow:'0 10px 40px rgba(37,211,102,0.5),inset 0 1px 0 rgba(255,255,255,0.3)'}} aria-label="WhatsApp Support">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
<span className="hidden sm:inline text-sm">Support</span>
</a>

<footer className="text-center py-10 px-4">
<div className="max-w-2xl mx-auto rounded-2xl py-6 px-6 border-2 border-yellow-500/40 relative overflow-hidden" style={{background:'linear-gradient(135deg,rgba(20,10,40,0.9),rgba(10,5,25,0.9))'}}>
<div className="absolute inset-0 opacity-20" style={{background:'radial-gradient(circle at 50% 50%,rgba(255,215,0,0.3),transparent 70%)'}}/>
<div className="relative"><p className="mb-3 text-sm text-white/60">© {new Date().getFullYear()} EduNotes Premium • All Rights Reserved</p><div className="h-px bg-gradient-to-r from-transparent via-yellow-500 to-transparent my-3"/><p className="font-black text-sm tracking-[0.15em] rainbow-text">DEVELOPED BY : ABHISHEK KUMAR YADAV</p></div>
</div>
</footer>
</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

setTimeout(()=>{
const l=document.getElementById('loading-screen'),r=document.getElementById('root');
if(l&&r&&r.innerHTML.trim())l.style.display='none';
},1500);
</script>
</body>
</html>
